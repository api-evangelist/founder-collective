name: Founder Collective
description: Founder Collective is a seed and pre-seed stage venture capital firm that describes itself
  as stage-focused, sector agnostic, and proudly anti-thematic. Founded more than fifteen years ago and
  operating from Cambridge, MA (Harvard Square) and New York, NY (SoHo), the firm positions itself as
  founder-aligned, backing capital-efficient companies from idea through IPO. General partners include
  Micah Rosenbloom, David Frankel, and Amanda Herson, with Eric Paley as partner emeritus. Notable portfolio
  companies include Uber, SeatGeek, WHOOP, The Trade Desk, Airtable, Cruise, Coupang, Verkada, Shield
  AI, and Suno. Its public portfolio lists 228 companies with year invested, location, and categories
  (B2B, consumer, ecommerce, AI, healthcare, finance, hardware), including 42 marked as acquired.
